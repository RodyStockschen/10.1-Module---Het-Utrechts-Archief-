services:
  app:
    build: .
    container_name: oudegracht_app
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: oudegracht_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oudegracht
      MYSQL_USER: hua
      MYSQL_PASSWORD: hua
    volumes:
      - dbdata:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-phua"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dbdata:
